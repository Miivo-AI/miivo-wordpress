# render health check target (set Health Check Path = /healthz in the
# dashboard). lives under /opt because the persistent disk mounted at
# /var/www/html shadows anything baked into the docroot. the file is static,
# but prefork still needs a free worker to serve it — so a saturated or
# wedged instance fails the check on purpose and render restarts it.
Alias /healthz /opt/healthz/healthz
<Directory /opt/healthz>
    Require all granted
</Directory>
