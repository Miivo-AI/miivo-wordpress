; cap runaway scripts: the default 30s is fine for pages, but wordpress
; raises it for some rest/admin paths; 60s is a hard ceiling that still
; allows plugin installs and upgrades. memory_limit stays at the image
; default (128M) — raising it would only raise the container's oom ceiling.
max_execution_time = 60

; php security advisory 2026-10-23 (CVE-2026-115560): keep session upload
; progress off until the next php bugfix release. wordpress does not use php
; sessions, so nothing depends on it. set here, not via ini_set or .user.ini,
; so it applies before request parsing.
session.upload_progress.enabled = 0
