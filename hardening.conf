# wordpress never runs php from uploads; the wp2shell webshells and most
# upload exploits rely on it, so refuse to serve or execute it there.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:php\d?|phtml|pht|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# xml-rpc is unused (the frontend reads the rest api) and is a common
# password brute-force target.
<Files "xmlrpc.php">
    Require all denied
</Files>
