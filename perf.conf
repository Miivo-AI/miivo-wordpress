# apache sizing for the render standard instance (2GB ram, 1 cpu). the stock
# debian prefork config allows 150 workers; each php+wordpress child holds
# 60-80MB, so a burst of slow requests forks the container straight into its
# memory limit (hit 535MB of the old 512MB cap during the 2026-08-20 outage,
# after "AH00161: server reached MaxRequestWorkers" on 2026-08-12). capping
# the pool makes excess requests queue in the accept backlog instead of
# eating memory, and a fully saturated box fails /healthz (see healthz.conf)
# so render restarts it instead of serving 502s until someone redeploys.
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         2
    MaxSpareServers         5
    ServerLimit             16
    MaxRequestWorkers       16
    MaxConnectionsPerChild  500
</IfModule>

# a slow or aborted client must not pin a worker for 5 minutes (stock 300):
# the next.js edge middleware aborts its fetches after 3s, but the worker
# kept running to the old timeout, so workers were consumed at request rate
# and released at 300s intervals.
Timeout 60
KeepAlive On
KeepAliveTimeout 2
